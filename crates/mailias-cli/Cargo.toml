[package]
name = "mailias"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Generate deterministic HMAC-verified email aliases"

[[bin]]
name = "mailias"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
mailias-core = { path = "../mailias-core" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
zeroize = "1.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints]
workspace = true

