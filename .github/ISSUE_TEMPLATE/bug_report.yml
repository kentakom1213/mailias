name: Bug report
description: Report a reproducible mailias problem
title: "bug: "
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Chrome extension
        - Firefox extension
        - Cloudflare Worker
        - Protocol
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Do not include recovery keys，forwarding addresses，or email contents．
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
